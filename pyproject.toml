[project]
name = "weather-ag-ui"
version = "0.1.0"
description = "AG2 weather agent with an AG-UI server and UI cards for Open-Meteo."
readme = "README.md"
requires-python = ">=3.10,<3.15"

dependencies = [
    "ag2[ag-ui,openai]>=1.1.2,<2",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
